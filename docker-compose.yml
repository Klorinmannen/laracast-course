services:
  apache2:
    build: ./apache2-1
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/src
      - ./apache2-1/httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - php-fpm
    networks:
      - laranet

  php-fpm:
    build: ./php
    volumes:
      - ./src:/var/www/src
    networks:
      - laranet

  mariadb:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laranet

volumes:
  db_data:

networks:
  laranet:
