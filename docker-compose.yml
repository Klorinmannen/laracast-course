services:
  apache2:
    build: ./docker/apache2
    ports:
      - "8000:80"
    volumes:
      - ./src/public:/var/www/src/public
      - ./docker/apache2/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./docker/apache2/extra/httpd-vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    depends_on:
      - laravel-app
    networks:
      - laranet

  laravel-app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/src
    networks:
      - laranet

  mariadb:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laranet

volumes:
  db_data:

networks:
  laranet:
